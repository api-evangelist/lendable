aid: lendable
name: Lendable
description: Lendable Ltd is a UK consumer lending fintech founded in 2014 and headquartered
  in London, offering unsecured personal loans directly to borrowers through a fully
  digital application. The company underwrites with technology and data analytics rather
  than relying on a credit score alone, describing its approach as looking at all of an
  applicant's data together to produce a personalised quote in minutes without paper forms
  or branch visits. Lendable distributes through the major UK price-comparison platforms
  including ClearScore, Compare the Market, MoneySuperMarket, Experian, TotallyMoney,
  TransUnion and Go.Compare. It is authorised and regulated by the Financial Conduct
  Authority (FCA reference 720261, company number 08828186) and is a CIFAS member.
  Lendable publishes no public developer API or developer portal — its public technical
  surface is an RFC 9116 security.txt, an llms.txt, and a set of first-party open source
  PHP/Symfony engineering libraries on Packagist and GitHub.
